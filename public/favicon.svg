<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lex Duo">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#e5506b"/>
      <stop offset="1" stop-color="#96243c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#badge)"/>
  <!-- Hairline inset: reads as a bevel at 32px+, disappears cleanly at 16px. -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="11.5" fill="none"
        stroke="#feedba" stroke-opacity="0.22" stroke-width="1"/>
  <!-- LD monogram as paths: an SVG favicon cannot load a webfont, so <text> would
       fall back to whatever serif the viewer's OS happens to ship. -->
  <g fill="#feedba">
    <path d="M12.5 17.5h7.6v21.2h10.8v6.8H12.5z"/>
    <path d="M34.4 17.5h8.9c6.4 0 10.5 5.6 10.5 14s-4.1 14-10.5 14h-8.9zm7.6 6.9v14.2h1.3c2.6 0 4.1-2.6 4.1-7.1s-1.5-7.1-4.1-7.1z"
          fill-rule="evenodd"/>
  </g>
</svg>
